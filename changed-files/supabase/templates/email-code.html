<!doctype html>
<html lang="en">
  <body style="font-family:Arial,sans-serif;background:#f8fafc;color:#0f172a;padding:24px">
    <div style="max-width:480px;margin:auto;background:white;border-radius:16px;padding:32px">
      <h1 style="color:#4f46e5;font-size:24px">KnowPass</h1>
      <h2 style="font-size:20px">Your email verification code</h2>
      <p>Enter this code on KnowPass to continue:</p>
      <p style="font-size:32px;font-weight:bold;letter-spacing:6px">{{ .Token }}</p>
      <p>This code can be used once. If it expires, request a new code on the website.</p>
      <p>If you didn’t request this email, you can ignore it. Do not share this code.</p>
    </div>
  </body>
</html>
